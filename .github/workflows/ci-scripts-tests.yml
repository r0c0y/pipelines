name: Isolated Merge Queue Integration Controller
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Isolated test operation
        type: choice
        options: [snapshot, admit, recover, quota_audit]
        default: snapshot
        required: true
      pr_number:
        description: Temporary-base PR number (required for admit)
        type: string
        default: ''
        required: false
permissions:
  contents: read
concurrency:
  group: isolated-mq-integration-20261113
  cancel-in-progress: false
jobs:
  controller:
    if: github.ref == 'refs/heads/codex/mq-integration-controller-rerun-20261113' && inputs.mode != 'quota_audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install -r .github/mq-integration/requirements.txt
      - name: Verify actual current-head PR CI with trusted publisher
        id: prepare
        if: inputs.mode == 'admit'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const {prepare} = require('./.github/mq-integration/controller');
            await prepare({github,context,core,number:Number(process.env.PR_NUMBER)});
      - name: Independently check current PR CI results
        id: poll
        if: inputs.mode == 'admit' && steps.prepare.outputs.ready == 'true'
        continue-on-error: true
        uses: wechuli/allcheckspassed@1e77c91db5ec91faa94bf441f91b91327d269ab0
        with:
          commit_sha: ${{ steps.prepare.outputs.head_sha }}
          poll: 'false'
          delay: '0'
          ignore_superseded_runs: 'true'
          checks_exclude: '^check_ci_status( \(.*\))?$,^queue_admission$,^Cleanup artifacts$,^Upload results$,^Agent$,^Prepare$'
          token: ${{ github.token }}
      - name: Publish exact verified PR attempt receipt
        if: always() && inputs.mode == 'admit' && steps.prepare.outputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
          HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
          BEFORE: ${{ steps.prepare.outputs.snapshot }}
          POLL_PASSED: ${{ steps.poll.outcome == 'success' }}
          POLL_SKIPPED: ${{ steps.poll.outcome == 'skipped' && steps.prepare.outcome == 'success' && steps.prepare.outputs.ready == 'false' }}
          PREPARED: ${{ steps.prepare.outputs.prepared_result }}
        with:
          script: |
            const {finalize} = require('./.github/mq-integration/controller');
            await finalize({github,context,core,number:process.env.PR_NUMBER,head:process.env.HEAD_SHA,
              before:process.env.BEFORE,pollPassed:process.env.POLL_PASSED==='true',
              pollSkipped:process.env.POLL_SKIPPED==='true',preparedResult:process.env.PREPARED});
      - name: Reconcile isolated admission and exact candidate dispatch
        if: always() && !cancelled() && inputs.mode != 'snapshot'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          MODE: ${{ inputs.mode }}
        with:
          script: |
            const {recover} = require('./.github/mq-integration/controller');
            await recover({github,context,core,number:Number(process.env.PR_NUMBER),admit:process.env.MODE==='admit'});
      - name: Record live queue and exact-SHA evidence
        id: snapshot
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const {snapshot} = require('./.github/mq-integration/controller');
            await snapshot({github,context,core,number:Number(process.env.PR_NUMBER)});
      - name: Upload isolated integration evidence
        if: always() && steps.snapshot.outputs.evidence != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mq-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.snapshot.outputs.evidence }}
          retention-days: 7

  quota_audit:
    if: github.ref == 'refs/heads/codex/mq-integration-controller-rerun-20261113' && inputs.mode == 'quota_audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Measure read-only recovery candidate selection
        id: audit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const {run} = require('./.github/mq-integration/quota_audit');
            await run({github,context,core});
      - name: Upload read-only quota audit evidence
        if: always() && steps.audit.outputs.evidence != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mq-quota-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.audit.outputs.evidence }}
          retention-days: 7
